<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">同一件事只记一次</text><text x="88" y="98" fill="#666666" font-size="16">任务 ID、来源和交付物一起确认唯一性</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><line x1="150" y1="360" x2="1050" y2="360" stroke="#222222" stroke-width="1"/><rect x="120" y="270" width="190" height="64" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="309" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">任务 ID</text><rect x="120" y="390" width="190" height="64" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="429" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">来源</text><rect x="340" y="330" width="190" height="64" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="435" y="369" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">交付物指纹</text><path d="M310 302 C360 302 370 340 420 340" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M310 422 C360 422 370 385 420 385" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><path d="M530 362 C600 300 670 300 730 360" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><circle cx="790" cy="360" r="52" fill="white" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="790" cy="360" r="6" fill="#2F6BFF"/><text x="790" y="354" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">一条记录</text><text x="790" y="380" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">唯一且可追溯</text><path d="M845 360 C900 320 940 320 990 360" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><rect x="990" y="320" width="100" height="80" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="1040" y="355" text-anchor="middle" fill="#111111" font-size="18" font-weight="600">可复核</text><text x="1040" y="380" text-anchor="middle" fill="#2F6BFF" font-size="12" font-weight="400">不重复</text><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">三个依据 → 一条账本记录</text></g></svg>
