<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#FFFFFF"/><g font-family="PingFang SC, Source Han Sans SC, Arial, sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#222222" stroke-width="1"/></marker></defs><text x="88" y="66" fill="#111111" font-size="32" font-weight="600">有证据，才进主结论</text><text x="88" y="98" fill="#666666" font-size="16">待审阅记录保留，但不影响保守汇总</text><line x1="88" y1="126" x2="1112" y2="126" stroke="#E8E8E8" stroke-width="1"/><line x1="210" y1="350" x2="990" y2="350" stroke="#222222" stroke-width="1"/><rect x="120" y="294" width="190" height="78" fill="#F5F5F5" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="330" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">已完成</text><text x="215" y="355" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">有交付物和来源</text><path d="M310 333 C400 280 470 280 545 333" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><circle cx="600" cy="350" r="50" fill="white" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="600" cy="350" r="6" fill="#2F6BFF"/><text x="600" y="345" text-anchor="middle" fill="#111111" font-size="19" font-weight="600">主结论</text><text x="600" y="371" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">可以汇总</text><path d="M655 333 C730 280 800 280 890 333" fill="none" stroke="#222222" stroke-width="1" marker-end="url(#arrow)"/><rect x="890" y="294" width="190" height="78" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1"/><text x="985" y="330" text-anchor="middle" fill="#111111" font-size="20" font-weight="600">保守汇总</text><text x="985" y="355" text-anchor="middle" fill="#2F6BFF" font-size="13" font-weight="400">只算能核对的</text><rect x="120" y="430" width="190" height="64" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1"/><text x="215" y="458" text-anchor="middle" fill="#111111" font-size="18" font-weight="600">待审阅</text><text x="215" y="481" text-anchor="middle" fill="#777777" font-size="12" font-weight="400">先保留，不计入</text><path d="M310 462 C410 520 480 520 545 390" fill="none" stroke="#B8B8B8" stroke-width="1"/><line x1="600" y1="404" x2="600" y2="470" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="4 8"/><text x="600" y="505" text-anchor="middle" fill="#777777" font-size="13" font-weight="400">复核后再改变结论</text><text x="600" y="558" text-anchor="middle" fill="#999999" font-size="14" font-weight="400">先留痕，再计入</text></g></svg>
